{% extends 'customer_base.html' %}
{% block title %}Customer Signup{% endblock %}
{% block page_title %}Create Customer Account{% endblock %}
{% block content %}
<div class="card" style="max-width:480px;margin:auto;">
  <div class="card-body">
    <form method="POST">
      {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
      <div class="form-group">
        <label>Full name</label>
        <input type="text" name="name" class="form-control" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" class="form-control" required>
      </div>
      <div class="form-group">
        <label>Phone (cellphone)</label>
        <input type="text" name="phone" class="form-control" placeholder="09xx xxx xxxx">
      </div>
      <div class="form-group">
        <label>Address / Location</label>
        <input type="text" name="address" class="form-control" placeholder="Delivery address">
      </div>
      <div class="form-group">
        <label>Password (min 6 chars)</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" name="confirm_password" class="form-control" required>
      </div>
      <div class="flex gap-2">
        <button class="btn btn-primary" type="submit">Create account</button>
        <a href="{{ url_for('customer_login') }}" class="btn btn-ghost">Login</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
