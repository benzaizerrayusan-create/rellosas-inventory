{% extends "base.html" %}
{% block title %}Add Rider{% endblock %}
{% block page_title %}Add Rider{% endblock %}
{% block topbar_actions %}
<a href="{{ url_for('riders') }}" class="btn btn-ghost btn-sm">← Back to Riders</a>
{% endblock %}
{% block content %}

<div class="card" style="max-width:600px">
  <div class="card-body">
    {% if error %}<div class="alert alert-error">⚠️ {{ error }}</div>{% endif %}
    <form method="POST">
      <div class="form-group">
        <label class="form-label">Name</label>
        <input type="text" name="name" class="form-control" required>
      </div>
      <div class="form-group">
        <label class="form-label">Phone</label>
        <input type="text" name="phone" class="form-control">
      </div>
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control">
      </div>
      <div class="flex gap-2 mt-4">
        <button type="submit" class="btn btn-primary">Add Rider</button>
        <a href="{{ url_for('riders') }}" class="btn btn-ghost">Cancel</a>
      </div>
    </form>
  </div>
</div>

{% endblock %}
