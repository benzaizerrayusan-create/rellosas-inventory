{% extends "rider_base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <h2>Change Password</h2>
    <p>Update your rider account password securely.</p>
  </div>
  <a href="{{ url_for('rider_dashboard') }}" class="btn btn-ghost btn-sm">← Back to Dashboard</a>
</div>

<div class="card" style="max-width:540px; margin:auto">
  <div class="card-body">
    {% if error %}<div class="alert alert-error">⚠️ {{ error }}</div>{% endif %}
    {% if success %}<div class="alert alert-success">✅ {{ success }}</div>{% endif %}
    <form method="POST">
      <div class="form-group">
        <label class="form-label">Current Password</label>
        <input type="password" name="current_password" class="form-control" required>
      </div>
      <div class="form-group">
        <label class="form-label">New Password</label>
        <input type="password" name="new_password" class="form-control" required>
      </div>
      <div class="form-group">
        <label class="form-label">Confirm New Password</label>
        <input type="password" name="confirm_password" class="form-control" required>
      </div>
      <div class="flex gap-2 mt-4">
        <button type="submit" class="btn btn-primary">Update Password</button>
        <a href="{{ url_for('rider_dashboard') }}" class="btn btn-ghost">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
