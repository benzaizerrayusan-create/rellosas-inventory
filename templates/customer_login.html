{% extends 'customer_base.html' %}
{% block title %}Customer Login{% endblock %}
{% block page_title %}Customer Login{% endblock %}
{% block content %}
<div class="card" style="max-width:480px;margin:auto;">
  <div class="card-body">
    <form method="POST">
      {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" class="form-control" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <input type="hidden" name="next" value="{{ next_url }}">
      <div class="flex gap-2">
        <button class="btn btn-primary" type="submit">Login</button>
        <a href="{{ url_for('customer_signup') }}" class="btn btn-ghost">Sign up</a>
      </div>
      <div class="mt-3"><a href="{{ url_for('customer_forgot_password') }}">Forgot password?</a></div>
    </form>
  </div>
</div>
{% endblock %}
