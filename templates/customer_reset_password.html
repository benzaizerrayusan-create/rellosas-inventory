{% extends "auth_base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="auth-title">Reset Password 🔒</div>
<div class="auth-sub">Enter your token and new password</div>

{% if error %}<div class="alert alert-error">⚠️ {{ error }}</div>{% endif %}
{% if message %}<div class="alert alert-success">✅ {{ message }} <a href="{{ url_for('customer_login') }}">Sign in →</a></div>{% endif %}

<form method="POST" class="auth-form">
  <div class="form-group">
    <label class="form-label">Reset Token</label>
    <input type="text" name="token" class="form-control" placeholder="Paste your reset token" required>
  </div>
  <div class="form-group">
    <label class="form-label">New Password</label>
    <input type="password" name="password" class="form-control" placeholder="At least 6 characters" required minlength="6">
  </div>
  <div class="form-group">
    <label class="form-label">Confirm New Password</label>
    <input type="password" name="confirm_password" class="form-control" placeholder="Repeat new password" required>
  </div>
  <button type="submit" class="btn btn-primary auth-submit">Reset Password →</button>
</form>

<div class="auth-footer"><a href="{{ url_for('customer_login') }}">Back to login</a></div>
{% endblock %}
